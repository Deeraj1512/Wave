// Top-level build file where you can add configuration options common to all sub-projects/modules.
// NOTE: Google's full mirror of Maven Central (maven-central.storage-download.googleapis.com)
// is listed right after google() in both repository blocks — some CI/sandbox networks
// rate-limit repo.maven.apache.org (HTTP 429), the mirror rides on dl.google.com infra.

buildscript {
    
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
