name: Spotify bridge (Cloudflare Worker)

# Deploys the tiny metadata-only Spotify bridge (bridge/) to Cloudflare
# Workers. This is SEPARATE from the app build: the Wave APK is still built
# only by the "Android APK" workflow (repo → Actions → APK, nothing hosted).
# The bridge is glue so the APK can reach Spotify without ever holding the
# client secret — Spotify blocks API calls that embed the secret in a client.
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN    token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard right rail
#   SPOTIFY_CLIENT_ID       from developer.spotify.com/dashboard (Wave app)
#   SPOTIFY_CLIENT_SECRET   same app
# After that every push touching bridge/** redeploys automatically.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bridge/**", ".github/workflows/deploy-bridge.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Add both under Settings → Secrets and variables → Actions → Secrets (see bridge/README.md)."
            exit 1
          fi

      - name: Deploy worker
        working-directory: bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Push Spotify credentials as Worker secrets
        working-directory: bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_CLIENT_SECRET" ]; then
            echo "::warning::SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET repo secrets are not set — the bridge answers configured:false until they are added and this job is re-run."
            exit 0
          fi
          printf %s "$SPOTIFY_CLIENT_ID" | npx wrangler secret put SPOTIFY_CLIENT_ID
          printf %s "$SPOTIFY_CLIENT_SECRET" | npx wrangler secret put SPOTIFY_CLIENT_SECRET

      - name: Summary
        run: echo "Bridge deployed. Copy the https://wave-bridge.YOUR-SUBDOMAIN.workers.dev URL from the 'Deploy worker' step log, then set the repository VARIABLE NEXT_PUBLIC_SPOTIFY_BRIDGE_URL to it and re-run 'Android APK'."
