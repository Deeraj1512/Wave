name: batch18 cleanup (remove the Spotify layer)

# One-shot removal of everything the Spotify integration added, now that Wave
# goes YouTube-Music-style (batch18). Spotify's Development Mode requires a
# Premium owning account and 403s catalog calls otherwise — the layer is dead
# weight, and the search UI no longer references any of it.
#
# Run ONCE: Actions tab → "batch18 cleanup (remove the Spotify layer)" →
# Run workflow. It deletes the dead files on main and pushes — which also
# triggers the Android APK build with the new search.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the Spotify layer (safe even if some paths never existed)
        run: |
          git rm -r --ignore-unmatch bridge src/lib/spotify src/app/api/spotify
          git rm --ignore-unmatch \
            .github/workflows/deploy-bridge.yml \
            netlify.toml \
            scripts/test_spotify_match.ts \
            scripts/test_bridge_smoke.ts

      - name: Commit and push
        run: |
          git config user.name "wave-batch18"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "batch18: remove the Spotify layer (Premium-gated in Dev Mode) — YouTube-Music-style search takes over" || echo "nothing to remove"
          git push
