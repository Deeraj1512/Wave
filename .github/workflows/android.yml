name: Android APK

# Builds the installable Wave APK on every push to main (and on demand).
# Grab it from: Actions → Android APK → latest run → Artifacts → wave-apk
#
# Signed with Wave's PERMANENT release key (stored in GitHub Secrets), so every
# build can be installed ON TOP of the previous one — no uninstall/reinstall.
# Required secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: oven-sh/setup-bun@v2

      # Fail fast with a clear message if the 4 secrets are not set yet
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing signing secrets. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Unpack the permanent keystore into the runner's temp dir (never committed)
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wave-release.keystore"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('android/*/build.gradle', 'android/build.gradle') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # static SPA export (scripts/build-apk-web.mjs) + cap sync into android/
      - name: Build web bundle + sync
        run: bun run build:apk

      - name: Assemble signed release APK
        env:
          WAVE_KEYSTORE_FILE: ${{ runner.temp }}/wave-release.keystore
          WAVE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WAVE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WAVE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      # Name the file by version so old downloads stay recognizable (wave-v12.apk …)
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/wave-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: android/app/build/outputs/apk/release/wave-v${{ github.run_number }}.apk
          if-no-files-found: error
