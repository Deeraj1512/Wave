name: Android APK

# Builds the installable Wave APK on every push to main (and on demand).
# Grab it from: Actions → Android APK → latest run → Artifacts → wave-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: oven-sh/setup-bun@v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('android/*/build.gradle', 'android/build.gradle') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # static SPA export (scripts/build-apk-web.mjs) + cap sync into android/
      - name: Build web bundle + sync
        run: bun run build:apk

      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
